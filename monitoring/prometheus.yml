# Prometheus Configuration for Lazarus Protocol

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'lazarus-protocol'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

# Rule files
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Lazarus Protocol API metrics
  - job_name: 'lazarus-api'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s

  # Redis metrics (if using Redis)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s

  # Database metrics (PostgreSQL/MySQL)
  - job_name: 'database'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s
