# Alertmanager Configuration for Lazarus Protocol

global:
  resolve_timeout: 5m
  # SMTP configuration for email alerts
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@lazarus-protocol.com'
  smtp_auth_username: 'alerts@lazarus-protocol.com'
  smtp_auth_password: 'your_password_here'

# Route configuration
route:
  group_by: ['alertname', 'severity', 'team']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  # Routes for different severity levels
  routes:
    # Critical alerts go to on-call team
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Warning alerts go to devops team
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    
    # Backend team alerts
    - match:
        team: backend
      receiver: 'backend-team'
      continue: true
    
    # DevOps team alerts
    - match:
        team: devops
      receiver: 'devops-team'
      continue: true
    
    # Support team alerts
    - match:
        team: support
      receiver: 'support-team'

# Receivers configuration
receivers:
  - name: 'default'
    email_configs:
      - to: 'alerts@lazarus-protocol.com'
        headers:
          Subject: '[Lazarus Protocol] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts'
        title: '[Lazarus Protocol] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@lazarus-protocol.com'
        headers:
          Subject: '[CRITICAL] Lazarus Protocol - {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#critical-alerts'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'danger'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        description: '{{ .GroupLabels.alertname }}'
        severity: 'critical'

  - name: 'warning-alerts'
    email_configs:
      - to: 'devops@lazarus-protocol.com'
        headers:
          Subject: '[WARNING] Lazarus Protocol - {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#warnings'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'warning'

  - name: 'backend-team'
    email_configs:
      - to: 'backend@lazarus-protocol.com'
        headers:
          Subject: '[Backend] Lazarus Protocol - {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#backend'
        title: '[Backend] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'devops-team'
    email_configs:
      - to: 'devops@lazarus-protocol.com'
        headers:
          Subject: '[DevOps] Lazarus Protocol - {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#devops'
        title: '[DevOps] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'support-team'
    email_configs:
      - to: 'support@lazarus-protocol.com'
        headers:
          Subject: '[Support] Lazarus Protocol - {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#support'
        title: '[Support] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

# Inhibition rules to prevent alert spam
inhibit_rules:
  # Inhibit warning alerts if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'team']
  
  # Inhibit backend alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['job']

# Templates for custom alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'
