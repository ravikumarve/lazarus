<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="#000000" rx="40"/>

  <circle cx="250" cy="250" r="160" fill="url(#redGlow)"/>

  <polygon points="250,80 400,165 400,335 250,420 100,335 100,165" fill="none" stroke="url(#metalEdge)" stroke-width="6"/>
  <polygon points="250,105 375,175 375,325 250,395 125,325 125,175" fill="none" stroke="#27272a" stroke-width="2"/>

  <path d="M 130 250 L 180 250 L 210 170 L 260 330 L 290 250 L 350 250" 
        fill="none" 
        stroke="#FF2A2A" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)"/>

  <circle cx="350" cy="250" r="10" fill="#ffffff" filter="url(#neonGlow)"/>

  <circle cx="150" cy="150" r="4" fill="#FF2A2A" filter="url(#neonGlow)"/>
  <circle cx="350" cy="130" r="3" fill="#DC2626"/>
  <circle cx="130" cy="350" r="5" fill="#FF2A2A" filter="url(#neonGlow)"/>
  <circle cx="360" cy="360" r="4" fill="#DC2626"/>
  <circle cx="250" cy="120" r="3" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="250" cy="380" r="3" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
