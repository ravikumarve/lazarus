<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="description" content="Lazarus Protocol Login - Secure authentication for crypto dead man's switch">
    <link rel="icon" type="image/svg+xml" href="/lazarus-logo.svg" />
    <title>Lazarus Protocol - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
    <div class="film-grain"></div>
    <button class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">🌓</button>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-header">
                <div class="logo"><img src="/lazarus-logo.svg" alt=""></div>
                <h1>Lazarus Protocol</h1>
                <p>Secure your digital legacy</p>
            </div>

            <div id="message-container"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        autocomplete="username"
                        placeholder="Enter your username or email"
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="remember-me">
                        <input 
                            type="checkbox" 
                            id="remember-me" 
                            name="remember-me"
                        >
                        Remember me for 30 days
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span id="login-btn-text">Login</span>
                    <span id="login-spinner" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="security-features">
                <h3>Security Features</h3>
                <ul>
                    <li>Military-grade encryption (AES-256-GCM)</li>
                    <li>Zero-knowledge architecture</li>
                    <li>Secure session management</li>
                    <li>CSRF protection</li>
                    <li>XSS prevention</li>
                </ul>
            </div>

            <div class="footer">
                <p>Protected by enterprise-grade security</p>
                <p><a href="/forgot-password">Forgot password?</a></p>
            </div>
        </div>
    </div>

    <!-- Load security module -->
    <script src="js/security.js"></script>
    
    <script>
        // Initialize security module
        const security = new LazarusSecurity({
            apiBase: window.location.origin,
            sessionTimeout: 30 * 60 * 1000, // 30 minutes
            tokenRefreshThreshold: 5 * 60 * 1000 // 5 minutes
        });

        // Check if already authenticated
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedTheme();
            // Wire theme toggle
            const themeToggle = document.querySelector('.theme-toggle');
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
            if (security.isAuthenticated()) {
                // Redirect to dashboard if already authenticated
                window.location.href = '/dashboard';
                return;
            }

            // Check for logout reason
            const urlParams = new URLSearchParams(window.location.search);
            const reason = urlParams.get('reason');
            
            if (reason) {
                const messages = {
                    'authentication_required': 'Authentication required to access this resource',
                    'session_expired': 'Your session has expired. Please login again.',
                    'logout': 'You have been logged out successfully.',
                    'security': 'For security reasons, please login again.'
                };
                
                if (messages[reason]) {
                    showMessage(messages[reason], 'info');
                }
            }
        });

        // Show message
        function showMessage(message, type = 'info') {
            const container = document.getElementById('message-container');
            const messageClass = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            
            container.innerHTML = `
                <div class="${messageClass} fade-in">
                    ${security.sanitizeHTML(message)}
                </div>
            `;
        }

        // Clear message
        function clearMessage() {
            document.getElementById('message-container').innerHTML = '';
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();
            
            clearMessage();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            
            // Validate inputs
            if (!username || !password) {
                showMessage('Please enter both username and password', 'error');
                return;
            }

            // Disable login button
            const loginBtn = document.getElementById('login-btn');
            const loginBtnText = document.getElementById('login-btn-text');
            const loginSpinner = document.getElementById('login-spinner');
            
            loginBtn.disabled = true;
            loginBtnText.style.display = 'none';
            loginSpinner.style.display = 'inline-block';

            try {
                // Authenticate with security module
                const result = await security.authenticate({
                    username: username,
                    password: password,
                    remember_me: rememberMe
                });

                if (result.success) {
                    showMessage('Login successful! Redirecting to dashboard...', 'success');
                    
                    // Redirect to dashboard after short delay
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    showMessage(result.error || 'Login failed. Please check your credentials.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('An error occurred during login. Please try again.', 'error');
            } finally {
                // Re-enable login button
                loginBtn.disabled = false;
                loginBtnText.style.display = 'inline';
                loginSpinner.style.display = 'none';
            }
        }

        // Theme management
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('lazarus-theme', newTheme);
            const themeToggle = document.querySelector('.theme-toggle');
            themeToggle.textContent = newTheme === 'dark' ? '🌓' : '🌙';
        }

        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('lazarus-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeToggle = document.querySelector('.theme-toggle');
            if (themeToggle) themeToggle.textContent = savedTheme === 'dark' ? '🌓' : '🌙';
        }

        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') {
                const form = document.getElementById('login-form');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
<script>document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });</script>
</body>
</html>
